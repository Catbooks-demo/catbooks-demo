# 캣북스 게이트웨이: 쇼핑몰 화면 / 와 판매 서버 /shop-api/ 를 한 포트로 낸다.
# AXcellent 화면·API(/admin/, /api/)는 이 게이트웨이에 두지 않는다. AXcellent는 고객사가 열어 준 API로만 연결한다.
# upstream은 변수로 지정해 요청 때마다 Docker DNS로 찾는다 (서비스가 재시작돼 IP가 바뀌어도, 아직 안 떠 있어도 nginx가 죽지 않는다)
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 리다이렉트에 내부 포트(80)가 아니라 접속한 주소 그대로를 쓴다 (공개 포트가 8080 등일 때)
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 쇼핑몰 화면이 쓰는 shop-api (접두사를 떼고 넘긴다)
    location /shop-api/ {
        # 주소는 환경 변수 SHOP_API_UPSTREAM (nginx 이미지가 시작할 때 envsubst로 채운다, 기본 http://shop-api:8010)
        set $shop_api ${SHOP_API_UPSTREAM};
        rewrite ^/shop-api/(.*)$ /$1 break;
        proxy_pass $shop_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        root /srv/shop;
        try_files $uri $uri/ /index.html;
    }
}
